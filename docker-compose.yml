services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sql_mastery}
      POSTGRES_USER: ${POSTGRES_USER:-sql_student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sql_student_password}
    ports:
      - "${POSTGRES_PORT:-5436}:5436"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sql_student} -d ${POSTGRES_DB:-sql_mastery}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-sql_student}:${POSTGRES_PASSWORD:-sql_student_password}@postgres:5432/${POSTGRES_DB:-sql_mastery}
      RESET_SQL_PATH: /app/db/init/01_lab.sql
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./server:/app
      - ./db:/app/db:ro
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3001}
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
